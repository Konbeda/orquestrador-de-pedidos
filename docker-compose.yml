services:
  app:
    build: .
    env_file: .env
    environment:
      # The image has no dev dependencies (pino-pretty): production, whatever .env says.
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/orders
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ['app']
    # 200 = ok or degraded (keeps receiving orders); only 503 (Mongo down) is unhealthy.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  mongo:
    image: mongo:8.0
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # BullMQ requires noeviction: an evicted key would silently lose jobs.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
